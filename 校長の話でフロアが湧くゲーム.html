<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>校長の話でフロアが湧くゲーム</title><style>
:root{--accent:#4db7ff}*{box-sizing:border-box}body{margin:0;background:#080b19;color:#fff;font-family:system-ui,'Hiragino Kaku Gothic ProN',sans-serif;overflow-x:hidden}main{max-width:650px;margin:auto;min-height:100dvh;padding:20px 17px 32px;display:flex;flex-direction:column;justify-content:center}h1{font-size:clamp(23px,6vw,36px);line-height:1.35;text-align:center;margin:8px 0 12px;text-shadow:0 0 24px #5a72ff}.sub{text-align:center;color:#bdc6e3;font-size:13px;margin:0 0 20px}.card{background:#161b35;border:1px solid #384367;border-radius:22px;padding:20px;box-shadow:0 18px 50px #0008}.label{font-weight:800;margin-bottom:10px}textarea{width:100%;height:135px;resize:none;border:2px solid #52619a;border-radius:14px;background:#090f26;color:white;font:16px/1.7 inherit;padding:13px;outline:none}textarea:focus{border-color:#76e0ff}.count{text-align:right;color:#a9b5d3;font-size:13px;margin:5px 0 15px}button{cursor:pointer;border:0;border-radius:14px;font-size:17px;font-weight:900;padding:16px;color:#10152d;background:linear-gradient(135deg,#7defff,#65a1ff);width:100%;box-shadow:0 5px 0 #31539c}button:active{transform:translateY(3px);box-shadow:0 2px 0 #31539c}button:disabled{opacity:.4;cursor:not-allowed}.hidden{display:none!important}.stage{position:relative;height:330px;overflow:hidden;border-radius:19px;background:radial-gradient(ellipse at 50% 30%,#3d4d83,#11172d 70%);perspective:750px;border:2px solid #56648b}.stage:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 48px,#ffffff08 49px 50px);pointer-events:none}.floor{position:absolute;width:115%;height:160px;bottom:-45px;left:-7%;background:repeating-linear-gradient(90deg,#242b4d 0 48px,#354164 49px 51px);transform:rotateX(65deg);border-top:5px solid #8591b8}.platform{position:absolute;bottom:105px;left:34%;width:32%;height:38px;background:linear-gradient(#815c46,#3e2630);transform:rotateX(25deg);border-radius:5px}.principal{position:absolute;bottom:137px;left:calc(50% - 18px);width:36px;height:77px;transform-style:preserve-3d;animation:principal 1.6s ease-in-out infinite}.principal .head{position:absolute;left:7px;top:0;width:23px;height:23px;border-radius:50%;background:#ffd4ad;box-shadow:inset -6px -2px #c99876}.principal .body{position:absolute;top:24px;left:2px;width:32px;height:46px;border-radius:8px 8px 3px 3px;background:linear-gradient(90deg,#25273d,#565b81,#222638)}.principal .tie{position:absolute;top:27px;left:16px;width:5px;height:25px;background:#d54563;clip-path:polygon(50% 0,100% 25%,70% 100%,30% 100%,0 25%)}.podium{position:absolute;bottom:112px;left:calc(50% - 39px);width:78px;height:65px;background:linear-gradient(110deg,#946646,#513628);clip-path:polygon(5% 0,95% 0,100% 100%,0 100%);border:3px solid #c08c58;box-shadow:0 8px 20px #0009}.crowd{position:absolute;bottom:0;left:0;width:100%;height:130px;transform:rotateX(13deg);transform-origin:bottom;display:flex;flex-wrap:wrap;align-content:end;justify-content:center;gap:2px;filter:drop-shadow(0 5px 3px #0009)}.student{position:relative;width:24px;height:38px;transform-origin:bottom;animation:idle 1.7s ease-in-out infinite alternate;animation-delay:var(--delay)}.student:before{content:'';position:absolute;top:0;left:5px;width:15px;height:15px;border-radius:50%;background:var(--skin);border-top:5px solid #202131}.student:after{content:'';position:absolute;bottom:0;left:1px;width:23px;height:25px;border-radius:8px 8px 3px 3px;background:var(--shirt)}.hype .student{animation:jump var(--speed) ease-in-out infinite;animation-delay:var(--delay)}.sleep .student{animation:sleep 1.5s ease-in-out infinite alternate}.flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff,transparent 70%)}.flashing .flash{animation:flash .3s linear 4}.rays{position:absolute;inset:-100%;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg,transparent 0 12deg,var(--glow) 13deg 18deg,transparent 19deg 30deg);animation:spin 3s linear infinite}.charged .rays{opacity:.55}.banner{position:absolute;top:12px;width:100%;text-align:center;font-size:clamp(21px,6vw,35px);font-weight:1000;letter-spacing:2px;text-shadow:0 3px 2px #000,0 0 15px var(--glow);z-index:4}.screen-shake{animation:shake .13s infinite}.message{text-align:center;font-size:20px;font-weight:900;margin:14px 0;min-height:32px}.meter{height:19px;border-radius:20px;background:#252d50;overflow:hidden;border:1px solid #7783a7}.meter>div{height:100%;width:0%;background:linear-gradient(90deg,#6dbdff,#ffdc5b,#f658ff);transition:width .12s}.percent{font-size:54px;font-weight:1000;text-align:center;margin:7px 0;text-shadow:0 0 22px var(--glow)}.rank{font-size:clamp(24px,7vw,38px);font-weight:1000;text-align:center;margin:12px 0;color:var(--glow);text-shadow:0 0 20px var(--glow)}.speech{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1025;border:1px solid #455173;border-radius:12px;padding:15px;margin:15px 0 20px;line-height:1.7}.resultbtns{display:grid;gap:13px}.secondary{background:#343e65;color:#fff;box-shadow:0 5px 0 #1a2041}.confetti{position:absolute;top:-20px;width:9px;height:17px;background:var(--c);left:var(--x);animation:fall var(--t) linear forwards;z-index:5}.footer{text-align:center;color:#6e789e;font-size:11px;margin-top:20px}@keyframes jump{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-28px) rotate(6deg)}}@keyframes idle{to{transform:translateY(-4px)}}@keyframes sleep{to{transform:rotate(17deg) translateY(6px)}}@keyframes principal{50%{transform:rotateY(13deg) rotateZ(3deg)}}@keyframes flash{50%{opacity:.95}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes shake{25%{transform:translate(4px,-3px)}75%{transform:translate(-4px,3px)}}@keyframes fall{to{transform:translateY(410px) rotate(720deg);opacity:0}}@media(prefers-reduced-motion:reduce){.student,.principal,.rays{animation-duration:3s}}
</style></head><body><main><h1>🎤 校長の話で<br>フロアが湧くゲーム</h1><p class="sub">校長の一言で、体育館を熱狂させろ！</p><section id="input" class="card"><div class="label">📢 全校生徒に何を話す？</div><textarea id="speech" maxlength="50" placeholder="例：今日の授業は全部休みにします！"></textarea><div class="count"><span id="count">0</span> / 50文字</div><button id="go" disabled>演説スタート！ ▶</button></section><section id="play" class="hidden"><div class="stage" id="stage"><div class="rays"></div><div class="floor"></div><div class="platform"></div><div class="principal"><div class="head"></div><div class="body"></div><div class="tie"></div></div><div class="podium"></div><div class="crowd" id="crowd"></div><div class="flash"></div><div class="banner" id="banner"></div></div><div class="message" id="message">全校集会、開幕…！</div><div class="meter"><div id="bar"></div></div><div class="percent" id="live">???</div></section><section id="result" class="card hidden"><div class="rank" id="rank"></div><div class="percent" id="final"></div><div style="text-align:center;color:#bac4e4">校長先生のありがたいお話</div><div class="speech" id="quoted"></div><div class="resultbtns"><button id="share">📤 シェア</button><button class="secondary" id="retry">↻ もう一度プレイ</button></div></section><div class="footer">端末内だけで動作・通信不要 / 3D風アニメーション</div></main><script>
const $=id=>document.getElementById(id),ta=$('speech');ta.addEventListener('input',()=>{$('count').textContent=Array.from(ta.value).length;$('go').disabled=!ta.value.trim();});
// 表現内容・語句・文の長さから端末内で採点。AIや外部サーバーへの送信なし。
function score(s){let v=s.normalize('NFKC').toLowerCase(),p=0;const rules=[[/休み|休校|授業なし|授業中止|帰っていい|帰宅|下校|放課後なし|テストなし|試験なし|宿題なし|課題なし|卒業|自由時間/g,85],[/給食.*(おかわり|無料|食べ放題)|おかわり.*自由|焼肉|寿司|ピザ|ラーメン|アイス|ケーキ|お菓子|ジュース/g,42],[/お金|現金|万円|億円|プレゼント|配布|無料|全員に|景品|宝くじ/g,52],[/ゲーム|スマホ|switch|スイッチ|マイクラ|ポケモン|デュエマ|遊び|祭り|ライブ|コンサート/g,38],[/好き|愛してる|最高|ありがとう|おめでとう|がんば|夢|希望|友情/g,20],[/校長|先生|生徒|みんな|諸君|皆さん/g,7],[/眠|長話|静かに|規則|校則|訓話|説教|反省|廊下|掃除|遅刻|成績|注意|禁止|黙れ|叱/g,-36],[/話が長|三時間|四時間|五時間|延長|説教/g,-55],[/うんこ|おなら|屁|爆発|踊|叫|わっしょい|祭/g,27],[/！|!|？|\?/g,5]];let matched=0;for(const [re,n] of rules){let a=[...v.matchAll(re)];if(a.length){p+=n*Math.min(a.length,3);matched+=a.length}}let chars=Array.from(s).length;p+=Math.min(14,Math.floor(chars/4));if(!matched)p+=8;let hash=2166136261;for(const ch of s){hash^=ch.codePointAt(0);hash=Math.imul(hash,16777619)}p+=((hash>>>0)%21)-10;return Math.max(0,Math.min(300,p));}
const tiers=[{min:100,name:'天上天下唯我独尊',color:'#ff71ef',label:'🌈 虹色・超覚醒！',speed:'.23s'},{min:80,name:'偉大なる校長',color:'#ffcd48',label:'👑 金色・大熱狂！',speed:'.34s'},{min:60,name:'今日の話は地域で噂',color:'#ff4e58',label:'🔥 赤色・大盛況！',speed:'.48s'},{min:30,name:'生徒は釘付けだ',color:'#53b8ff',label:'💙 青色・盛り上がり！',speed:'.68s'},{min:5,name:'普通の朝',color:'#f0f3ff',label:'✨ 白色・いつもの集会',speed:'1.1s'},{min:0,name:'睡眠導入剤',color:'#747c99',label:'……しーん……',speed:'2s'}];
let audio;function beep(f=440,d=.08,type='sine',vol=.05){try{audio??=new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));function crowd(){let el=$('crowd');el.innerHTML='';for(let i=0;i<125;i++){let x=document.createElement('div');x.className='student';x.style.cssText=`--delay:${(i*0.137%1.8).toFixed(2)}s;--skin:${['#eebf9a','#f8d9bd','#c99978'][i%3]};--shirt:${['#e6e9f3','#a7b6db','#ccd3e7'][i%3]};`;el.appendChild(x)}}crowd();
function confetti(n){let el=$('stage');for(let i=0;i<n;i++){let c=document.createElement('div');c.className='confetti';c.style.cssText=`--x:${Math.random()*100}%;--t:${1.2+Math.random()*2}s;--c:hsl(${Math.random()*360} 95% 65%);animation-delay:${Math.random()*.7}s`;el.appendChild(c);setTimeout(()=>c.remove(),4000)}}
let busy=false;$('go').onclick=async()=>{if(busy)return;busy=true;let s=ta.value.trim(),pct=score(s),tier=tiers.find(t=>pct>=t.min);$('input').classList.add('hidden');$('result').classList.add('hidden');$('play').classList.remove('hidden');let stage=$('stage');stage.className='stage';stage.style.setProperty('--glow',tier.color);document.documentElement.style.setProperty('--glow',tier.color);$('crowd').className='crowd';$('banner').textContent='校長、登壇！';$('message').textContent='全校生徒が見守っている…';$('live').textContent='???';$('bar').style.width='0%';beep(300,.18);await wait(1000);$('banner').textContent='運命の判定！';$('message').textContent='盛り上がりゲージ、チャージ！';stage.classList.add('charged');for(let i=0;i<22;i++){let x=Math.floor((i/21)*Math.min(100,pct));$('bar').style.width=x+'%';$('live').textContent=x+'%';if(i%3===0)beep(240+i*27,.06,'square',.025);await wait(75+i*3)}$('live').textContent='！？';$('message').textContent='これは……！？';stage.classList.add('screen-shake');await wait(750);stage.classList.remove('screen-shake');stage.classList.add('flashing');if(pct<5){$('banner').textContent='✨ 大当たり……？';beep(750,.25);await wait(650);stage.classList.remove('charged');$('banner').textContent='💤 シーーーン……';$('crowd').classList.add('sleep');beep(130,.7,'sawtooth',.03);$('message').textContent='生徒たちは夢の中へ…';}else{$('banner').textContent=tier.label;$('crowd').classList.add('hype');stage.style.setProperty('--speed',tier.speed);if(pct>=60)confetti(pct>=100?110:55);for(let i=0;i<6;i++)beep(420+i*120,.13,'triangle',.045);$('message').textContent=pct>=100?'体育館の屋根が吹き飛ぶ勢い！！':'生徒たちが反応している！'}$('bar').style.width=Math.min(100,pct)+'%';$('live').textContent=pct+'%';await wait(2100);$('play').classList.add('hidden');$('result').classList.remove('hidden');$('rank').textContent=tier.name;$('rank').style.color=tier.color;$('final').textContent=pct+'%';$('quoted').textContent='「'+s+'」';busy=false};
$('retry').onclick=()=>{$('result').classList.add('hidden');$('input').classList.remove('hidden');ta.value='';ta.dispatchEvent(new Event('input'));ta.focus()};$('share').onclick=async()=>{let t=`🎤 校長の話でフロアが湧くゲーム\n「${ta.value.trim()}」\n盛り上がり度：${$('final').textContent}\n称号：${$('rank').textContent}`;if(navigator.share){try{await navigator.share({title:'校長の話でフロアが湧くゲーム',text:t});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(t);alert('結果をコピーしたよ！')}catch(e){prompt('結果をコピーしてシェアしてね',t)}};
</script></body></html>
